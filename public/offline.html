<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You are offline | Sharpixa</title>
    <meta name="theme-color" content="#6366f1" />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI",
          Roboto, Helvetica, Arial, sans-serif;
      }
      body {
        display: grid;
        place-items: center;
        background-color: #fafafa;
        background-image: radial-gradient(
            at 20% 20%,
            rgba(99, 102, 241, 0.12) 0px,
            transparent 50%
          ),
          radial-gradient(
            at 80% 10%,
            rgba(168, 85, 247, 0.1) 0px,
            transparent 50%
          );
        color: #111827;
        padding: 24px;
      }
      main {
        text-align: center;
        max-width: 420px;
        background: #ffffff;
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 20px;
        padding: 40px 32px;
        box-shadow: 0 10px 30px rgba(99, 102, 241, 0.15);
      }
      img {
        width: 88px;
        height: 88px;
        border-radius: 22px;
        display: inline-block;
      }
      h1 {
        font-size: 1.35rem;
        margin: 20px 0 8px;
      }
      p {
        margin: 0 0 24px;
        color: #4b5563;
        font-size: 0.95rem;
        line-height: 1.6;
      }
      a {
        display: inline-block;
        font-weight: 600;
        color: #ffffff;
        padding: 12px 24px;
        border-radius: 12px;
        background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
        text-decoration: none;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }
      a:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(99, 102, 241, 0.45);
      }
      a:active {
        transform: translateY(0);
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-512.png" alt="Sharpixa logo" />
      <h1>You are offline</h1>
      <p>
        The Sharpixa image and video tools need an internet connection to
        load. Reconnect and come back to remove backgrounds, clean up
        watermarks, and enhance your photos.
      </p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
